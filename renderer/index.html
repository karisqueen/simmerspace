<!doctype html>
<html lang="en" data-family="purple" data-mode="light" data-density="comfortable" data-motion="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://media.forgecdn.net; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A visual manager for Sims 4 mods and custom content." />
    <title>SimmerSpace</title>
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/pages.css" />
    <link rel="stylesheet" href="./styles/mods-manager.css" />
  </head>
  <body>
    <a class="skip-link" id="skip-link" href="#page-content">Skip to content</a>
    <div class="app-shell">
      <div class="sidebar-slot"><aside class="sidebar" id="sidebar"></aside></div>
      <main class="main-area">
        <header class="topbar">
          <div class="topbar-title" id="topbar-title"></div>
          <div class="top-actions">
            <label class="search-field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="search-input" type="search" placeholder="" autocomplete="off" /><kbd aria-hidden="true">Ctrl K</kbd></label>
            <button class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
            <button class="icon-btn account-button" id="profile-button" aria-label="Account"></button>
          </div>
        </header>
        <div class="content-wrap" id="page-content" tabindex="-1"></div>
        <footer class="footer-note"><span id="footer-copy"></span> <span aria-hidden="true">·</span> <b id="footer-version"></b></footer>
      </main>
    </div>
    <div class="overlay" id="overlay" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./js/core.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/demo-data.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/icons.js"></script>
    <script src="./js/appearance.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/mods-manager.js"></script>
    <script src="./js/organizer.js"></script>
    <script src="./js/folders.js"></script>
    <script src="./js/curseforge.js"></script>
    <script src="./js/account.js"></script>
    <script src="./js/tour.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
