<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A cozy visual manager for Sims 4 custom content." />
    <title>SimmerSpace</title>
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/mods-manager.css" />
    <link rel="stylesheet" href="./styles/refinements.css" />
  </head>
  <body class="theme-soft-lavender">
    <a class="skip-link" id="skip-link" href="#page-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs"><span id="crumb-kicker"></span><b aria-hidden="true"> / </b><strong id="crumb-title"></strong></div>
          <div class="top-actions">
            <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="" autocomplete="off" /><kbd aria-hidden="true">Ctrl K</kbd></label>
            <button class="theme-toggle" id="theme-toggle" aria-label="Switch theme"><span class="theme-icon" aria-hidden="true">☾</span></button>
            <button class="avatar top-avatar" id="profile-button" aria-label="Profile">S</button>
          </div>
        </header>
        <div class="content-wrap" id="page-content" tabindex="-1"></div>
        <footer class="footer-note"><span aria-hidden="true">✦</span> <span id="footer-copy"></span> <span aria-hidden="true">·</span> <b id="footer-version"></b></footer>
      </main>
    </div>
    <div class="overlay" id="overlay" hidden><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./js/core.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/demo-data.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/mods-manager.js"></script>
    <script src="./js/organizer.js"></script>
    <script src="./js/folders.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
